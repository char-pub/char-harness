# Opt-in overlay for an initialized roleplay profile. All endpoints and credentials are local configuration.
# Rows a --patch overlay inserts are composed after the profile's cordis.patch.yml, so Settings reports their
# live fields read-only. Copy these rows into the profile's cordis.patch.yml to edit the model settings there.
- insert:
    - id: roleplay-config-editor
      name: '@deepseek-ai/dsh-config-editor'
      disabled: !!js "!ctx.get('profileContext')"
    - id: roleplay-settings
      name: '@deepseek-ai/dsh-settings'
      disabled: !!js "!ctx.get('profileContext')"
    - id: roleplay-credentials
      name: '@deepseek-ai/dsh-credentials-local'
    - id: roleplay-model
      name: '@deepseek-ai/dsh-llm-deepseek-api-key'
    - id: roleplay-app
      name: '@deepseek-ai/dsh-experimental-charpub-roleplay-runtime/app'
      config:
        host: 127.0.0.1
        port: !!js Number(process.env.CHARPUB_APP_PORT)
        registry_origin: !!js process.env.CHARPUB_REGISTRY_ORIGIN || 'https://char.pub'
        issuer: !!js process.env.CHARPUB_OAUTH_ISSUER || 'https://char.pub/v1/auth'
        client_id: !!js process.env.CHARPUB_OAUTH_CLIENT_ID
        timeout_ms: !!js Number(process.env.CHARPUB_REQUEST_TIMEOUT_MS)
        max_request_bytes: !!js Number(process.env.CHARPUB_APP_REQUEST_BYTES)
        max_response_bytes: !!js Number(process.env.CHARPUB_APP_RESPONSE_BYTES)
        max_artifact_bytes: !!js Number(process.env.CHARPUB_APP_ARTIFACT_BYTES)
        profile:
          runtime: {name: charpub-roleplay-app, version: '1'}
          tokenizer: estimate
          mode: narrator
          context_window: !!js Number(process.env.CHARPUB_CONTEXT_WINDOW)
          reserve_for_output: !!js Number(process.env.CHARPUB_OUTPUT_TOKENS)
          # DeepSeek system messages replace prior snapshots; the SDK must merge adjacent regions.
          capabilities: {system_role: true, multiple_system_messages: false}
        model:
          provider: deepseek-official
          model: !!js process.env.CHARPUB_MODEL
          reasoningEffort: off
          maxTokens: !!js Number(process.env.CHARPUB_OUTPUT_TOKENS)
        play:
          decisions:
            provider: deepseek-official
            model: !!js process.env.CHARPUB_DECISION_MODEL ?? process.env.CHARPUB_MODEL
            # The bounded decision output includes reasoning and the structured result.
            reasoningEffort: low
            temperature: 0
            maxTokens: 12288
          limits:
            min_confidence: 0.8
            max_actions: 4
            max_decision_calls: 3
            max_decision_tokens: 64000
        credential_ref: DEEPSEEK_API_KEY
